[package]
name = "quotos-app"
version = "0.5.1"
description = "Quotos: menu bar quota tracker for AI subscriptions"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quotos_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time"] }
portable-pty = "0.9"

# Real system text through Core Text for the status item's colored
# percentage digits. macOS-only, since the whole crate only ever runs on
# macOS as a menu bar app. Pinned to exactly what tauri's own transitive
# use of the objc2 family already resolves in Cargo.lock, so `cargo check`
# needs no network access to add new crate versions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
# Default features pull in objc2-core-video, which is not resolved in
# Cargo.lock and would need network access to add. NSFont and
# NSFontDescriptor lookups do not need it.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSWindow",
    # NSStatusItem.setLength, reached through tray_icon::TrayIcon::ns_status_item().
    # Already resolved in Cargo.lock: the tray-icon crate itself requests
    # these same three for the same objc2-app-kit version, so this adds no
    # new resolution.
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "objc2-core-foundation",
    "objc2-core-text",
] }
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-text = "0.3.2"
# Default features on objc2-core-graphics pull in objc2-metal, which is not
# resolved in Cargo.lock and would require network access to add. This
# requests only what CGBitmapContext-based text rendering actually needs.
# CTFont and CTFontDrawGlyphs pull in their own narrower objc2-core-graphics
# feature set, which Cargo unions with this crate's request automatically.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "CGContext",
    "CGBitmapContext",
    "CGColorSpace",
    "CGColor",
    "CGImage",
] }
