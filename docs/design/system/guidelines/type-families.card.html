<!-- @dsCard group="Type" viewport="700x180" name="Font families" subtitle="Inter for UI text · MonoLisa for every number that matters" -->
<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:20px;display:flex;gap:24px;color:var(--text-primary)}
.col{flex:1}
.k{font-size:11px;color:var(--text-quaternary);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.big{font-size:26px;letter-spacing:-.02em}
.mono{font-family:var(--font-mono)}
.spec{font-size:12px;color:var(--text-tertiary);margin-top:8px}
.set{font-family:var(--font-mono);font-size:20px;letter-spacing:.02em;color:var(--text-primary)}</style></head>
<body data-appearance="dark">
<div class="col"><div class="k">Sans — Inter</div>
<div class="big">On which can I keep working?</div>
<div class="spec">Inter (variable) · UI text, labels, copy · 11–16px</div></div>
<div class="col"><div class="k">Mono — MonoLisa</div>
<div class="big mono">62% · 8% · resets 3h</div>
<div class="set">0123456789 % —</div>
<div class="spec">numerals, keys, timestamps · tabular</div></div>
</body></html>
