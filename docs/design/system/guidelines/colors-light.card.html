<!-- @dsCard group="Colors" viewport="700x150" name="Light appearance" subtitle="Every token mirrors for light mode via [data-appearance=light]" -->
<!DOCTYPE html><html data-appearance="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:18px;display:flex;gap:16px}
.surfaces{display:flex;gap:8px;flex:1}
.s{flex:1;height:84px;border-radius:8px;border:0.5px solid var(--border-default);display:flex;align-items:flex-end;padding:7px;font-size:10px;color:var(--text-tertiary)}
.text{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center;background:var(--bg-panel);border:0.5px solid var(--border-default);border-radius:8px;padding:12px}
.text span{font-size:13px}
.dot{display:inline-flex;gap:6px;align-items:center}
.d{width:8px;height:8px;border-radius:999px}</style></head>
<body data-appearance="light">
<div class="surfaces">
<div class="s" style="background:var(--bg-base)">base</div>
<div class="s" style="background:var(--bg-panel)">panel</div>
<div class="s" style="background:var(--bg-elevated)">elevated</div>
<div class="s" style="background:var(--teal-muted)">selected</div>
</div>
<div class="text">
<span style="color:var(--text-primary)">Primary text</span>
<span class="dot"><span class="d" style="background:var(--teal)"></span><span style="color:var(--text-secondary)">accent · teal</span></span>
<span class="dot"><span class="d" style="background:var(--amber)"></span><span style="color:var(--text-secondary)">behind · amber</span></span>
<span class="dot"><span class="d" style="background:var(--red)"></span><span style="color:var(--text-secondary)">broken · red</span></span>
</div>
</body></html>
