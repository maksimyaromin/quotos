<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & text — dark" subtitle="Depth from a single float; surfaces step by one" -->
<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:18px;display:flex;gap:16px}
.surfaces{display:flex;gap:8px;flex:1}
.s{flex:1;height:84px;border-radius:8px;border:0.5px solid var(--border-default);display:flex;align-items:flex-end;padding:7px;font-size:10px;color:var(--text-tertiary)}
.text{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center;background:var(--bg-panel);border:0.5px solid var(--border-default);border-radius:8px;padding:12px}
.text span{font-size:13px}</style></head>
<body data-appearance="dark">
<div class="surfaces">
<div class="s" style="background:var(--bg-base)">base</div>
<div class="s" style="background:var(--bg-panel)">panel</div>
<div class="s" style="background:var(--bg-elevated)">elevated</div>
<div class="s" style="background:var(--bg-input)">input</div>
</div>
<div class="text">
<span style="color:var(--text-primary)">Primary — the number</span>
<span style="color:var(--text-secondary)">Secondary — labels</span>
<span style="color:var(--text-tertiary)">Tertiary — meta, timestamps</span>
<span style="color:var(--text-quaternary)">Quaternary — disabled</span>
</div>
</body></html>
