<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:24px;color:var(--text-primary);display:flex;gap:40px;align-items:center}
.item{display:flex;flex-direction:column;gap:12px;align-items:center}
.k{font-size:11px;color:var(--text-quaternary);letter-spacing:.04em;text-transform:uppercase}
.mark{color:var(--text-primary)}
.big{color:var(--teal)}
.word{font-size:38px;font-weight:600;letter-spacing:-.03em;color:var(--text-primary)}
.note{font-size:11px;color:var(--text-tertiary);max-width:200px;line-height:1.4}</style></head>
<body data-appearance="dark">
<div class="item"><span class="k">Tray glyph</span>
<svg class="mark" width="26" height="26" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.4" stroke="currentColor" stroke-width="1.4" opacity="0.28"/><path d="M4.46 12.02a5.4 5.4 0 1 1 7.08 0" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
</div>
<div class="item"><span class="k">App icon</span>
<svg width="52" height="52" viewBox="0 0 512 512" fill="none"><rect width="512" height="512" rx="114" fill="var(--teal)"/><g transform="translate(80,80) scale(22)"><circle cx="8" cy="8" r="5.4" stroke="#fff" stroke-width="1.4" opacity="0.4"/><path d="M4.46 12.02a5.4 5.4 0 1 1 7.08 0" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></g></svg>
</div>
<div class="item"><span class="k">Wordmark</span><span class="word">Quotos</span></div>
<div class="note">A proposed original mark: a capacity gauge. The tray shows it alone, monochrome, whenever nothing is pinned. Not derived from any existing logo.</div>
</body></html>
