<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:22px;display:flex;gap:16px}
.b{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center}
.box{width:100%;height:70px;background:var(--bg-panel);border-radius:var(--radius-md)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head>
<body data-appearance="dark">
<div class="b"><div class="box" style="border:0.5px solid var(--border-subtle)"></div><span class="tok">subtle · 6%</span></div>
<div class="b"><div class="box" style="border:0.5px solid var(--border-default)"></div><span class="tok">default · 10%</span></div>
<div class="b"><div class="box" style="border:0.5px solid var(--border-strong)"></div><span class="tok">strong · 16%</span></div>
<div class="b"><div class="box" style="border:1px solid var(--border-focus);box-shadow:var(--shadow-focus)"></div><span class="tok">focus · teal ring</span></div>
</body></html>
