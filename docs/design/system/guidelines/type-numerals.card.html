<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-mono);padding:20px;color:var(--text-primary);display:flex;align-items:flex-end;gap:34px}
.n{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tok{font-family:var(--font-sans);font-size:11px;color:var(--text-tertiary)}
.v{font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em;font-weight:500}
.u{font-size:.6em;color:var(--text-tertiary)}</style></head>
<body data-appearance="dark">
<div class="n"><span class="v" style="font-size:44px">8<span class="u">%</span></span><span class="tok">--numeral-xl · verify hero</span></div>
<div class="n"><span class="v" style="font-size:30px">62<span class="u">%</span></span><span class="tok">--numeral-lg · row headline</span></div>
<div class="n"><span class="v" style="font-size:18px">100<span class="u">%</span></span><span class="tok">--numeral-md · menu bar</span></div>
<div class="n"><span class="v" style="font-size:13px">41<span class="u">%</span></span><span class="tok">--numeral-sm · window</span></div>
</body></html>
