<!DOCTYPE html>
<html data-appearance="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./styles.css">
<style>
  html,body{margin:0;width:1280px;height:854px;overflow:hidden}
  .tile{display:flex;width:1280px;height:854px}
  .main{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--teal);overflow:hidden}
  .name{font-family:var(--font-sans);font-weight:600;font-size:150px;letter-spacing:-.04em;color:#06231f}
  .strip{width:230px;flex:0 0 230px;display:flex;flex-direction:column}
  .strip span{flex:1}
</style>
</head>
<body data-appearance="dark">
<div class="tile">
  <div class="main"><div class="name">Quotos</div></div>
  <div class="strip">
    <span style="background:var(--amber)"></span>
    <span style="background:var(--blue)"></span>
    <span style="background:var(--red)"></span>
    <span style="background:var(--teal-dim)"></span>
  </div>
</div>
</body>
</html>
