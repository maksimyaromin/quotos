<!-- @dsCard group="Quotos" viewport="1000x600" name="Quotos — interactive panel" subtitle="Click the menu-bar ring: panel, states, refresh, pin, add-subscription flow, light/dark" -->
<!DOCTYPE html>
<html data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotos</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;height:100%;background:#08090b}
  #root{height:100%}
  a{color:var(--text-accent)}a:hover{color:var(--teal-bright)}
  svg.lucide{stroke-width:1.8}
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body data-appearance="dark">
<template id="__bundler_thumbnail">
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#3f8b7e">
<svg width="30%" height="30%" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.4" stroke="#fff" stroke-width="1.4" opacity="0.4"/><path d="M4.46 12.02a5.4 5.4 0 1 1 7.08 0" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg>
</div>
</template>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<script type="text/babel">
/* Quotos UI kit — interactive prototype. Composes the design-system
   primitives from the compiled bundle. Attaches nothing global except the
   mount at the end. */
const { Button, IconButton, TextField, Panel, SubscriptionRow, MenuBarTile, QuotaGlyph } = window.QuotosDesignSystem_52e720;

/* ---- lucide icon helper ---- */
function Icon({ name, size = 14, strokeWidth = 1.8 }) {
  const r = React.useRef(null);
  React.useLayoutEffect(() => {
    if (!r.current || !window.lucide) return;
    r.current.innerHTML = "";
    const i = document.createElement("i"); i.setAttribute("data-lucide", name);
    r.current.appendChild(i);
    window.lucide.createIcons({ attrs: { width: size, height: size, "stroke-width": strokeWidth } });
  });
  return <span ref={r} style={{ display: "inline-flex", width: size, height: size }} />;
}

/* ---- a selectable list item used throughout the add flow ---- */
function ChoiceRow({ title, detail, tag, disabled, selected, onClick, trailing }) {
  const [h, setH] = React.useState(false);
  return (
    <button type="button" disabled={disabled} onClick={disabled ? undefined : onClick}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        display: "flex", alignItems: "center", gap: "var(--space-2-5)", width: "100%",
        textAlign: "left", padding: "var(--space-2-5)", border: `0.5px solid ${selected ? "var(--teal)" : "var(--border-default)"}`,
        borderRadius: "var(--radius-md)", cursor: disabled ? "default" : "pointer",
        background: selected ? "var(--teal-muted)" : h && !disabled ? "var(--bg-row-hover)" : "var(--bg-elevated)",
        opacity: disabled ? 0.45 : 1, transition: "background var(--dur-fast), border-color var(--dur-fast)",
      }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-base)", fontWeight: "var(--weight-medium)", color: "var(--text-primary)" }}>{title}</span>
          {tag ? <span style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-xs)", color: "var(--teal-bright)", background: "var(--teal-muted)", padding: "1px 5px", borderRadius: "var(--radius-xs)" }}>{tag}</span> : null}
        </div>
        {detail ? <div style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", color: "var(--text-tertiary)", marginTop: 2 }}>{detail}</div> : null}
      </div>
      {trailing || (selected ? <span style={{ color: "var(--teal)" }}><Icon name="check" size={15} strokeWidth={2.2} /></span>
        : <span style={{ color: "var(--text-quaternary)" }}><Icon name="chevron-right" size={15} /></span>)}
    </button>
  );
}

function SheetHeader({ title, onBack, onClose, step, total }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "var(--space-2)", padding: "var(--space-2-5) var(--space-3)", borderBottom: "0.5px solid var(--border-subtle)" }}>
      {onBack ? <IconButton label="Back" onClick={onBack}><Icon name="chevron-left" size={16} /></IconButton> : <span style={{ width: 24 }} />}
      <div style={{ flex: 1, textAlign: "center" }}>
        <div style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-base)", fontWeight: "var(--weight-semibold)", color: "var(--text-primary)" }}>{title}</div>
        {total ? <div style={{ fontFamily: "var(--font-mono)", fontSize: "var(--text-2xs)", color: "var(--text-quaternary)", letterSpacing: ".06em", marginTop: 1 }}>STEP {step} / {total}</div> : null}
      </div>
      <IconButton label="Close" onClick={onClose}><Icon name="x" size={16} /></IconButton>
    </div>
  );
}

function Spinner({ size = 16 }) {
  return (
    <span style={{ display: "inline-block", width: size, height: size }}>
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={{ animation: "quotos-spin 0.8s linear infinite" }}>
        <circle cx="12" cy="12" r="9" stroke="var(--border-strong)" strokeWidth="2.5" />
        <path d="M21 12a9 9 0 0 0-9-9" stroke="var(--teal)" strokeWidth="2.5" strokeLinecap="round" />
      </svg>
      <style>{`@keyframes quotos-spin{to{transform:rotate(360deg)}}`}</style>
    </span>
  );
}

/* ---- the add-subscription wizard (lives inside the popover) ---- */
function AddFlow({ onClose, onDone }) {
  const A = window.QUOTOS_ADD;
  const [step, setStep] = React.useState("scan"); // scan|found|provider|method|verify|result|failed
  const [method, setMethod] = React.useState(null);
  const [key, setKey] = React.useState("");

  React.useEffect(() => {
    if (step === "scan") { const t = setTimeout(() => setStep("found"), 1400); return () => clearTimeout(t); }
    if (step === "verify") {
      const t = setTimeout(() => setStep(method === "key" && key.trim() !== "sk-ant-ok" ? "failed" : "result"), 1600);
      return () => clearTimeout(t);
    }
  }, [step, method, key]);

  const pad = { display: "flex", flexDirection: "column", gap: "var(--space-2)", padding: "var(--space-3)" };
  const lead = { fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", color: "var(--text-secondary)", lineHeight: "var(--leading-snug)" };

  let header, body;
  if (step === "scan") {
    header = <SheetHeader title="Add subscription" onClose={onClose} />;
    body = (
      <div style={{ ...pad, alignItems: "center", padding: "var(--space-6) var(--space-3)", gap: "var(--space-3)" }}>
        <Spinner size={22} />
        <div style={{ ...lead, textAlign: "center" }}>Scanning this Mac for subscriptions Quotos can read…</div>
      </div>
    );
  } else if (step === "found") {
    header = <SheetHeader title="Add subscription" onClose={onClose} step={1} total={4} />;
    body = (
      <div style={pad}>
        <div style={lead}>Found {A.found.length} on this Mac. Add one, or connect something else.</div>
        {A.found.map(f => <ChoiceRow key={f.id} title={f.label} detail={f.detail} onClick={() => { setMethod("cli"); setStep("verify"); }} trailing={<Button size="sm" variant="secondary">Add</Button>} />)}
        <button type="button" onClick={() => setStep("provider")} style={{ background: "none", border: 0, padding: "var(--space-1) 0", cursor: "pointer", textAlign: "left", fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", color: "var(--text-accent)", fontWeight: "var(--weight-medium)" }}>Connect a different account →</button>
      </div>
    );
  } else if (step === "provider") {
    header = <SheetHeader title="Choose a provider" onBack={() => setStep("found")} onClose={onClose} step={2} total={4} />;
    body = (
      <div style={pad}>
        {A.providers.map(p => <ChoiceRow key={p.id} title={p.label} detail={p.detail} disabled={!p.available} onClick={() => setStep("method")} />)}
      </div>
    );
  } else if (step === "method") {
    header = <SheetHeader title="How to connect" onBack={() => setStep("provider")} onClose={onClose} step={3} total={4} />;
    body = (
      <div style={pad}>
        <div style={lead}>Pick how Quotos reads this account. All stay on this Mac.</div>
        {A.methods.map(m => <ChoiceRow key={m.id} title={m.label} detail={m.detail} tag={m.recommended ? "Recommended" : null} selected={method === m.id} onClick={() => setMethod(m.id)} trailing={<span />} />)}
        {method === "key" ? <TextField label="API key" mono placeholder="sk-ant-… (try sk-ant-ok)" value={key} onChange={e => setKey(e.target.value)} /> : null}
        <Button variant="primary" fullWidth disabled={!method} onClick={() => setStep("verify")}>Verify and read once</Button>
      </div>
    );
  } else if (step === "verify") {
    header = <SheetHeader title="Verifying" onClose={onClose} step={4} total={4} />;
    body = (
      <div style={{ ...pad, alignItems: "center", padding: "var(--space-6) var(--space-3)", gap: "var(--space-3)" }}>
        <Spinner size={22} />
        <div style={{ ...lead, textAlign: "center" }}>Reading once to confirm this is the right account…</div>
      </div>
    );
  } else if (step === "failed") {
    header = <SheetHeader title="Couldn’t verify" onBack={() => setStep("method")} onClose={onClose} />;
    body = (
      <div style={pad}>
        <div style={{ display: "flex", gap: "var(--space-2)", padding: "var(--space-2-5)", background: "var(--red-muted)", borderRadius: "var(--radius-md)", alignItems: "flex-start" }}>
          <span style={{ color: "var(--red)", marginTop: 1 }}><Icon name="alert-triangle" size={16} strokeWidth={2} /></span>
          <div style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", color: "var(--text-secondary)", lineHeight: "var(--leading-snug)" }}>
            That key was rejected. It may be for a different account, or expired. Nothing was saved.
          </div>
        </div>
        <Button variant="primary" fullWidth onClick={() => setStep("method")}>Try another way</Button>
      </div>
    );
  } else if (step === "result") {
    const v = A.verified;
    header = <SheetHeader title="Confirm account" onClose={onClose} />;
    body = (
      <div style={pad}>
        <div style={lead}>Read succeeded. Is this the account you meant?</div>
        <div style={{ padding: "var(--space-3)", background: "var(--bg-elevated)", border: "0.5px solid var(--border-default)", borderRadius: "var(--radius-md)", textAlign: "center" }}>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "var(--numeral-xl)", fontWeight: "var(--weight-medium)", color: "var(--teal)", lineHeight: 1, letterSpacing: "-.02em" }}>{v.used}<span style={{ fontSize: 24 }}>%</span></div>
          <div style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", color: "var(--text-tertiary)", marginTop: 4 }}>used · {v.resetLabel}</div>
          <div style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-md)", fontWeight: "var(--weight-semibold)", color: "var(--text-primary)", marginTop: 10 }}>{v.label}</div>
          <div style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", color: "var(--text-tertiary)" }}>{v.account} · {v.provider}</div>
        </div>
        <div style={{ display: "flex", gap: "var(--space-2)" }}>
          <Button variant="ghost" onClick={onClose} style={{ flex: 1 }}>Not this account</Button>
          <Button variant="primary" onClick={() => onDone(v)} style={{ flex: 1 }}>Add it</Button>
        </div>
      </div>
    );
  }

  return <div>{header}{body}</div>;
}

/* ---- empty panel (no subscriptions at all) ---- */
function EmptyState({ onAdd }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", gap: "var(--space-3)", padding: "var(--space-6) var(--space-5) var(--space-5)" }}>
      <span style={{ color: "var(--text-quaternary)" }}><QuotaGlyph size={30} /></span>
      <div>
        <div style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-md)", fontWeight: "var(--weight-semibold)", color: "var(--text-primary)" }}>No subscriptions yet</div>
        <div style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-sm)", color: "var(--text-tertiary)", marginTop: 4, lineHeight: "var(--leading-snug)", maxWidth: 232 }}>Quotos scans this Mac for accounts it can read. Nothing leaves your machine.</div>
      </div>
      <Button variant="primary" icon={<Icon name="plus" size={13} />} onClick={onAdd}>Add your first subscription</Button>
    </div>
  );
}

/* ---- the whole app: desktop chrome + menu bar + popover ---- */
function App() {
  const [appearance, setAppearance] = React.useState("dark");
  const [open, setOpen] = React.useState(true);
  const [view, setView] = React.useState("list"); // list | add
  const [subs, setSubs] = React.useState(window.QUOTOS_SEED);
  const [demo, setDemo] = React.useState("full");
  const [expanded, setExpanded] = React.useState({ max: true });
  const [anchor, setAnchor] = React.useState({ right: 78, beak: 40 });
  const tileRef = React.useRef(null);

  React.useEffect(() => { document.body.setAttribute("data-appearance", appearance); }, [appearance]);

  const placePopover = React.useCallback(() => {
    const el = tileRef.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const width = 332;
    const right = Math.max(10, window.innerWidth - r.right - 6);
    const panelLeft = window.innerWidth - right - width;
    const beak = Math.min(width - 22, Math.max(16, (r.left + r.width / 2) - panelLeft));
    setAnchor({ right, beak });
  }, []);
  React.useLayoutEffect(() => { if (open) placePopover(); }, [open, view, placePopover]);
  React.useEffect(() => { window.addEventListener("resize", placePopover); return () => window.removeEventListener("resize", placePopover); }, [placePopover]);

  const shownSubs = demo === "empty" ? [] : subs;
  // Pinning is per-window: the menu bar shows every pinned window's figure.
  const pinned = shownSubs.flatMap(s => (s.windows || []).filter(w => w.pinned).map(w => ({ used: w.used, state: s.state })));

  const withPinDerived = (x, windows) => ({ ...x, windows, pinnedCount: windows.filter(w => w.pinned).length, headlinePinned: !!(windows[0] && windows[0].pinned) });
  const toggleHeadlinePin = id => setSubs(s => s.map(x => x.id === id ? withPinDerived(x, x.windows.map((w, i) => i === 0 ? { ...w, pinned: !w.pinned } : w)) : x));
  const toggleWindowPin = (id, windowId) => setSubs(s => s.map(x => x.id === id ? withPinDerived(x, x.windows.map(w => w.id === windowId ? { ...w, pinned: !w.pinned } : w)) : x));
  const toggleExpand = id => setExpanded(e => ({ ...e, [id]: !e[id] }));

  const refresh = () => {
    setSubs(s => s.map(x => (x.state === "working" || x.state === "behind") ? { ...x, state: "reading" } : x));
    setTimeout(() => {
      setSubs(s => s.map(x => x.state === "reading" ? {
        ...x, state: "working", lastRead: "just now", badge: null, footerNote: null,
        used: window.quotosJitter(x.used),
        windows: (x.windows || []).map(w => ({ ...w, used: window.quotosJitter(w.used) })),
      } : x));
    }, 1200);
  };

  const addSub = v => {
    setView("list");
    setSubs(s => [{ id: "added-" + Date.now(), label: v.label, provider: v.provider, account: v.account, state: "working", used: v.used, severity: "healthy", resetLabel: v.resetLabel, lastRead: "just now", pinnedCount: 0, headlinePinned: false, windows: v.windows }, ...s]);
  };

  const wallpaper = appearance === "dark"
    ? "radial-gradient(120% 90% at 30% -10%, #1b2733 0%, #0c0f12 55%, #08090b 100%)"
    : "radial-gradient(120% 90% at 30% -10%, #dfe4ea 0%, #c7ccd3 55%, #b9bfc7 100%)";

  return (
    <div style={{ position: "fixed", inset: 0, background: wallpaper, overflow: "hidden", fontFamily: "var(--font-sans)" }}>
      {/* menu bar */}
      <div style={{
        position: "absolute", top: 0, left: 0, right: 0, height: 26,
        display: "flex", alignItems: "center", gap: 18, padding: "0 12px",
        background: appearance === "dark" ? "rgba(22,24,28,0.55)" : "rgba(250,250,252,0.6)",
        backdropFilter: "saturate(160%) blur(20px)", WebkitBackdropFilter: "saturate(160%) blur(20px)",
        borderBottom: appearance === "dark" ? "0.5px solid rgba(255,255,255,0.08)" : "0.5px solid rgba(0,0,0,0.08)",
        zIndex: 10, color: appearance === "dark" ? "rgba(255,255,255,0.9)" : "rgba(0,0,0,0.8)",
      }}>
        <span style={{ fontSize: 13, fontWeight: 700 }}>Finder</span>
        {["File", "Edit", "View", "Window", "Help"].map(m => <span key={m} style={{ fontSize: 13, opacity: 0.7 }}>{m}</span>)}
        <span style={{ flex: 1 }} />
        {/* Quotos status item (third-party items sit left of system ones) */}
        <span ref={tileRef} style={{ display: "inline-flex", color: appearance === "dark" ? "rgba(255,255,255,0.92)" : "rgba(0,0,0,0.82)" }}>
          <MenuBarTile pins={pinned} showStrip={false} onClick={() => { setOpen(o => !o); setView("list"); }} />
        </span>
        {/* system items */}
        <svg width="22" height="12" viewBox="0 0 26 13" fill="none" style={{ opacity: 0.7 }}><rect x="0.5" y="0.5" width="22" height="12" rx="3" stroke="currentColor" /><rect x="2" y="2" width="16" height="9" rx="1.5" fill="currentColor" /><rect x="23.5" y="4" width="2" height="5" rx="1" fill="currentColor" opacity="0.7" /></svg>
        <span style={{ fontSize: 13, opacity: 0.85 }}>Mon 9:41</span>
      </div>

      {/* popover */}
      {open ? (
        <div style={{ position: "absolute", top: 30, right: anchor.right, zIndex: 20, animation: "quotos-pop var(--dur-base) var(--ease-out) both" }}>
          <div style={{ position: "absolute", top: -5, left: anchor.beak, transform: "translateX(-50%) rotate(45deg)", width: 11, height: 11, background: "var(--bg-panel)", borderTop: "0.5px solid var(--border-strong)", borderLeft: "0.5px solid var(--border-strong)", borderTopLeftRadius: 3, zIndex: 2 }} />
          <div style={{ width: 332, background: "var(--bg-panel)", backdropFilter: "var(--blur-vibrancy)", WebkitBackdropFilter: "var(--blur-vibrancy)", border: "0.5px solid var(--border-strong)", borderRadius: "var(--radius-xl)", boxShadow: "var(--shadow-popover)", overflow: "hidden" }}>
            {view === "add" ? (
              <AddFlow onClose={() => setView("list")} onDone={addSub} />
            ) : (
              <>
                <div style={{ display: "flex", alignItems: "center", gap: "var(--space-2)", padding: "var(--space-2-5) var(--space-3)", borderBottom: "0.5px solid var(--border-subtle)" }}>
                  <span style={{ flex: 1, fontSize: "var(--text-base)", fontWeight: "var(--weight-semibold)", color: "var(--text-primary)", letterSpacing: "var(--tracking-tight)" }}>Quotos</span>
                  <IconButton label={appearance === "dark" ? "Light appearance" : "Dark appearance"} onClick={() => setAppearance(a => a === "dark" ? "light" : "dark")}><Icon name={appearance === "dark" ? "sun" : "moon"} size={15} /></IconButton>
                  <IconButton label="Refresh all" onClick={refresh}><Icon name="refresh-cw" size={14} /></IconButton>
                  <IconButton label="Settings"><Icon name="settings" size={15} /></IconButton>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: "var(--space-0-5)", padding: "var(--space-1-5)", maxHeight: 452, overflowY: "auto" }}>
                  {shownSubs.length === 0 ? (
                    <EmptyState onAdd={() => setView("add")} />
                  ) : shownSubs.map(s => (
                    <SubscriptionRow key={s.id} {...s}
                      expanded={!!expanded[s.id]}
                      onToggleExpand={() => toggleExpand(s.id)}
                      onTogglePin={() => toggleHeadlinePin(s.id)}
                      onToggleWindowPin={wid => toggleWindowPin(s.id, wid)}
                      onAction={() => setView("add")} />
                  ))}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: "var(--space-2)", padding: "var(--space-2) var(--space-3)", borderTop: "0.5px solid var(--border-subtle)" }}>
                  <Button variant="ghost" size="sm" icon={<Icon name="plus" size={13} />} onClick={() => setView("add")}>Add subscription</Button>
                  <span style={{ flex: 1 }} />
                  <span style={{ fontFamily: "var(--font-sans)", fontSize: "var(--text-xs)", color: "var(--text-quaternary)" }}>Auto-refreshing · 2 min</span>
                </div>
              </>
            )}
          </div>
        </div>
      ) : null}

      {/* hint */}
      <div style={{ position: "absolute", bottom: 16, left: 0, right: 0, textAlign: "center", color: appearance === "dark" ? "rgba(255,255,255,0.4)" : "rgba(0,0,0,0.4)", fontSize: 12 }}>
        <div>Click the ring to toggle the panel · refresh, pin, expand a row, add a subscription · unpin all to see the tray as icon-only</div>
        <div style={{ marginTop: 10, display: "flex", gap: 8, justifyContent: "center" }}>
          {[["full", "Full panel"], ["empty", "Empty state"]].map(([k, l]) => (
            <button key={k} type="button" onClick={() => { setDemo(k); setOpen(true); setView("list"); }}
              style={{ fontFamily: "var(--font-sans)", fontSize: 11, padding: "3px 10px", borderRadius: 999, cursor: "pointer", border: demo === k ? "0.5px solid var(--teal)" : "0.5px solid var(--border-default)", background: demo === k ? "var(--teal-muted)" : "transparent", color: demo === k ? "var(--text-accent)" : (appearance === "dark" ? "rgba(255,255,255,0.55)" : "rgba(0,0,0,0.55)") }}>{l}</button>
          ))}
        </div>
      </div>

      <style>{`@keyframes quotos-pop{from{transform:translateY(-6px)}to{transform:none}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
