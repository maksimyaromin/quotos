<!-- @dsCard group="Components" viewport="700x430" name="Shell — panel & menu bar" subtitle="The popover container and the tray tile" -->
<!DOCTYPE html>
<html data-appearance="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);padding:20px}
  #root{width:100%}
  .wrap{display:flex;gap:28px;align-items:flex-start}
  .col{display:flex;flex-direction:column;gap:12px}
  .lbl{font-size:11px;color:var(--text-quaternary);letter-spacing:.04em;text-transform:uppercase}
  svg.lucide{stroke-width:1.8}
</style>
</head>
<body data-appearance="dark">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Panel, SubscriptionRow, MenuBarTile, IconButton, Button } = window.QuotosDesignSystem_52e720;
function Icon({ name, size = 14 }) {
  const r = React.useRef(null);
  React.useLayoutEffect(() => {
    if (!r.current || !window.lucide) return;
    r.current.innerHTML = "";
    const i = document.createElement("i"); i.setAttribute("data-lucide", name); r.current.appendChild(i);
    window.lucide.createIcons({ attrs: { width: size, height: size } });
  });
  return <span ref={r} style={{ display: "inline-flex", width: size, height: size }} />;
}
function App() {
  return (
    <div className="wrap">
      <div className="col">
        <span className="lbl">Menu-bar tile</span>
        <MenuBarTile pins={[]} />
        <MenuBarTile pins={[{ remaining: 62, state: "working" }]} />
        <MenuBarTile pins={[{ remaining: 62, state: "working" }, { remaining: 8, state: "working" }]} />
        <MenuBarTile pins={[{ remaining: 40, state: "behind" }, { state: "broken" }]} />
      </div>
      <div className="col">
        <span className="lbl">Panel</span>
        <Panel title="Quotos" beak={false}
          headerActions={<><IconButton label="Refresh"><Icon name="refresh-cw" /></IconButton><IconButton label="Add"><Icon name="plus" /></IconButton><IconButton label="Settings"><Icon name="settings" /></IconButton></>}
          footer={<Button variant="ghost" size="sm" icon={<Icon name="plus" />}>Add subscription</Button>}>
          <SubscriptionRow label="Claude Max" account="Personal" provider="Anthropic" state="working" remaining={62} resetLabel="resets in 3h" lastRead="2 min ago" pinned windows={[{ name: "Session", remaining: 62 }]} />
          <SubscriptionRow label="Claude Team" account="Work" provider="Anthropic" state="behind" remaining={40} lastRead="41 min ago" windows={[{ name: "Session", remaining: 40 }]} />
        </Panel>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
