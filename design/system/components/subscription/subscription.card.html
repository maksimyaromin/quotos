<!DOCTYPE html>
<html data-appearance="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);padding:20px}
  #root{width:100%}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .surf{background:var(--bg-panel);border:0.5px solid var(--border-default);border-radius:var(--radius-lg)}
</style>
</head>
<body data-appearance="dark">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { SubscriptionRow } = window.QuotosDesignSystem_52e720;
function App() {
  const [exp, setExp] = React.useState(true);
  return (
    <div className="grid">
      <div className="surf">
        <SubscriptionRow label="Claude Max" provider="Anthropic" account="Personal"
          state="working" remaining={62} resetLabel="resets in 3h" lastRead="2 min ago" pinned
          expanded={exp} onToggleExpand={() => setExp(!exp)}
          windows={[
            { name: "Session", remaining: 62, resetLabel: "resets in 3h" },
            { name: "Weekly", remaining: 41, resetLabel: "resets Mon", scope: "Opus 4" },
            { name: "Code review", resetLabel: null },
          ]} />
      </div>
      <div className="surf">
        <SubscriptionRow label="Claude Team" provider="Anthropic" account="Work"
          state="behind" remaining={40} resetLabel="resets in 5h" lastRead="41 min ago"
          windows={[{ name: "Session", remaining: 40, resetLabel: "resets in 5h" }]} />
      </div>
      <div className="surf">
        <SubscriptionRow label="Research key" provider="Anthropic" account="API"
          state="waiting" remaining={88} resetLabel="resets weekly" lastRead="just now"
          windows={[{ name: "Weekly", remaining: 88 }]} />
      </div>
      <div className="surf">
        <SubscriptionRow label="Old account" provider="Anthropic" account="Personal"
          state="broken" reason="Sign-in expired. Reconnect to resume reading." lastRead="1h ago"
          actionLabel="Reconnect" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
