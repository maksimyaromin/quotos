<!-- @dsCard group="Components" viewport="700x230" name="Indicators" subtitle="Capacity bars, status dots, badges" -->
<!DOCTYPE html>
<html data-appearance="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);padding:20px}
  #root{width:100%}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .lbl{font-size:11px;color:var(--text-quaternary);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
  .barrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .barrow .cap{font-family:var(--font-mono);font-size:12px;color:var(--text-tertiary);width:66px;flex:0 0 auto}
  .barrow .b{flex:1}
  .dots{display:flex;flex-direction:column;gap:8px}
  .dot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body data-appearance="dark">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { CapacityBar, StatusDot, Badge } = window.QuotosDesignSystem_52e720;
const states = [
  ["working","Working"],["reading","Reading"],["behind","Behind"],["repairing","Repairing"],
  ["broken","Broken"],["waiting","Waiting on limits"],["connecting","Connecting"],["idle","Not connected"],
];
function App() {
  return (
    <div className="grid">
      <div>
        <div className="lbl">Capacity — fill encodes what's left</div>
        {[["78% left",78,{}],["42% left",42,{}],["18% left",18,{}],["6% left",6,{}],["62% · reading",62,{reading:true}],["40% · behind",40,{stale:true}]].map(([c,r,p],i)=>(
          <div className="barrow" key={i}><span className="cap">{c}</span><span className="b"><CapacityBar remaining={r} {...p} /></span></div>
        ))}
        <div className="badges">
          <Badge tone="neutral">Weekly</Badge>
          <Badge tone="accent">Opus 4</Badge>
          <Badge tone="warn">Behind</Badge>
          <Badge tone="danger">Broken</Badge>
          <Badge tone="info">Waiting on limits</Badge>
        </div>
      </div>
      <div>
        <div className="lbl">Status — calm, per subscription</div>
        <div className="dots">
          {states.map(([s,l])=>(<div className="dot" key={s}><StatusDot state={s} /> {l}</div>))}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
