<!-- @dsCard group="Colors" viewport="700x170" name="Capacity scale" subtitle="The only place color changes meaning by value: teal › amber › red" -->
<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:18px}
.row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.n{font-family:var(--font-mono);font-size:13px;color:var(--text-primary);width:64px}
.track{flex:1;height:6px;background:var(--cap-track);border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px}
.t{font-size:11px;color:var(--text-tertiary);width:120px}</style></head>
<body data-appearance="dark">
<div class="row"><span class="n">78%</span><span class="track"><span class="fill" style="width:78%;background:var(--cap-healthy)"></span></span><span class="t">healthy · &gt; 25% left</span></div>
<div class="row"><span class="n">22%</span><span class="track"><span class="fill" style="width:22%;background:var(--cap-warn)"></span></span><span class="t">warn · ≤ 25% left</span></div>
<div class="row"><span class="n">7%</span><span class="track"><span class="fill" style="width:7%;background:var(--cap-critical)"></span></span><span class="t">critical · ≤ 10% left</span></div>
</body></html>
