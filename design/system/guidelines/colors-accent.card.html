<!-- @dsCard group="Colors" viewport="700x150" name="Accent — teal" subtitle="The single brand accent, and the healthy-capacity fill" -->
<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:18px}
.row{display:flex;gap:14px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:64px;border-radius:8px;border:0.5px solid var(--border-subtle)}
.nm{font-size:12px;color:var(--text-secondary)}
.hex{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head>
<body data-appearance="dark"><div class="row">
<div class="sw"><div class="chip" style="background:var(--teal-muted)"></div><div class="nm">--teal-muted</div><div class="hex">tint / selected</div></div>
<div class="sw"><div class="chip" style="background:var(--teal-dim)"></div><div class="nm">--teal-dim</div><div class="hex">#1c8a7e</div></div>
<div class="sw"><div class="chip" style="background:var(--teal)"></div><div class="nm">--teal · accent</div><div class="hex">#2ec4b0</div></div>
<div class="sw"><div class="chip" style="background:var(--teal-bright)"></div><div class="nm">--teal-bright</div><div class="hex">#46d6c2 · hover</div></div>
</div></body></html>
