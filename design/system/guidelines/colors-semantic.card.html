<!-- @dsCard group="Colors" viewport="700x160" name="Semantic hues" subtitle="Muted by design — spent only on the rare case that needs attention" -->
<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pair{display:flex;gap:8px;align-items:stretch}
.chip{flex:1;height:52px;border-radius:8px;border:0.5px solid var(--border-subtle)}
.mut{flex:0 0 34px}
.nm{font-size:12px;color:var(--text-secondary);margin-top:8px}
.use{font-size:11px;color:var(--text-tertiary)}</style></head>
<body data-appearance="dark"><div class="grid">
<div><div class="pair"><div class="chip" style="background:var(--amber)"></div><div class="chip mut" style="background:var(--amber-muted)"></div></div><div class="nm">--amber</div><div class="use">behind · stale · getting low</div></div>
<div><div class="pair"><div class="chip" style="background:var(--red)"></div><div class="chip mut" style="background:var(--red-muted)"></div></div><div class="nm">--red</div><div class="use">broken · nearly out</div></div>
<div><div class="pair"><div class="chip" style="background:var(--blue)"></div><div class="chip mut" style="background:var(--blue-muted)"></div></div><div class="nm">--blue</div><div class="use">in progress · waiting on limits</div></div>
</div></body></html>
