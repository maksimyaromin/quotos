<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="macOS geometry: 5–6px controls, ~12px popover, ~4px chips" -->
<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:20px;display:flex;gap:16px}
.b{flex:1;display:flex;flex-direction:column;gap:8px;align-items:center}
.box{width:100%;height:66px;background:var(--bg-elevated);border:0.5px solid var(--border-strong)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head>
<body data-appearance="dark">
<div class="b"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="tok">xs · 3</span></div>
<div class="b"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="tok">sm · 5</span></div>
<div class="b"><div class="box" style="border-radius:var(--radius-md)"></div><span class="tok">md · 7</span></div>
<div class="b"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="tok">lg · 10</span></div>
<div class="b"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="tok">xl · 12</span></div>
<div class="b"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="tok">pill</span></div>
</body></html>
