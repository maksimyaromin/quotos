<!-- @dsCard group="Colors" viewport="700x150" name="Neutral ramp" subtitle="Cool graphite — carries nearly every surface and text color" -->
<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:18px}
.ramp{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:6px;border:0.5px solid var(--border-subtle)}
.n{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);text-align:center}</style></head>
<body data-appearance="dark"><div class="ramp">
<script>for(let i=0;i<=11;i++){document.write(`<div class="sw"><div class="chip" style="background:var(--graphite-${i})"></div><div class="n">${i}</div></div>`)}</script>
</div></body></html>
