<!-- @dsCard group="Elevation" viewport="700x210" name="Shadows" subtitle="One float for the popover; inner surfaces stay flat" -->
<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:26px;display:flex;gap:26px;align-items:center}
.b{flex:1;display:flex;flex-direction:column;gap:12px;align-items:center}
.card{width:100%;height:84px;background:var(--bg-panel);border:0.5px solid var(--border-strong);border-radius:var(--radius-lg)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}</style></head>
<body data-appearance="dark">
<div class="b"><div class="card" style="box-shadow:var(--shadow-popover)"></div><span class="tok">--shadow-popover</span></div>
<div class="b"><div class="card" style="box-shadow:var(--shadow-menu)"></div><span class="tok">--shadow-menu</span></div>
<div class="b"><div class="card" style="box-shadow:var(--shadow-sheet)"></div><span class="tok">--shadow-sheet</span></div>
</body></html>
