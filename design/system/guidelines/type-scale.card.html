<!-- @dsCard group="Type" viewport="700x260" name="UI text scale" subtitle="Compact — this lives in a ~332px popover, not a web page" -->
<!DOCTYPE html><html data-appearance="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);padding:20px;color:var(--text-primary)}
.r{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:0.5px solid var(--border-subtle)}
.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);width:96px;flex:0 0 auto}
.px{font-family:var(--font-mono);font-size:11px;color:var(--text-quaternary);width:44px;flex:0 0 auto}
.s{color:var(--text-primary)}</style></head>
<body data-appearance="dark">
<div class="r"><span class="tok">--text-xl</span><span class="px">20px</span><span class="s" style="font-size:20px;letter-spacing:-.02em;font-weight:600">Add a subscription</span></div>
<div class="r"><span class="tok">--text-lg</span><span class="px">16px</span><span class="s" style="font-size:16px;font-weight:600">Panel heading</span></div>
<div class="r"><span class="tok">--text-md</span><span class="px">14px</span><span class="s" style="font-size:14px;font-weight:600">Claude Max (row title)</span></div>
<div class="r"><span class="tok">--text-base</span><span class="px">13px</span><span class="s" style="font-size:13px">Body & control label</span></div>
<div class="r"><span class="tok">--text-sm</span><span class="px">12px</span><span class="s" style="font-size:12px;color:var(--text-secondary)">Secondary · provider name</span></div>
<div class="r"><span class="tok">--text-xs</span><span class="px">11px</span><span class="s" style="font-size:11px;color:var(--text-tertiary)">Last read 2 min ago</span></div>
<div class="r"><span class="tok">--text-2xs</span><span class="px">10px</span><span class="s" style="font-size:10px;color:var(--text-tertiary);letter-spacing:.04em;text-transform:uppercase">Micro meta</span></div>
</body></html>
